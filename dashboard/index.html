<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bifrost</title>
  <link rel="icon" type="image/svg+xml" href="/bifrost.svg">
  <!-- The look of the media server hub (Reactor, Cyberpunk or Hogwarts), from its theme kit on port 80 of
       this host. When the hub does not answer, the page keeps its own night look below. -->
  <script>document.write(`<link rel="stylesheet" href="//${location.hostname}/theme/theme.css"><script src="//${location.hostname}/theme/theme.js"><\/script>`)</script>
  <style>
    :root {
      --bg: var(--t-bg, #0b1020); --card: var(--t-surface, #121a33); --text: var(--t-text, #e6ecff); --muted: var(--t-muted, #8e9bc4);
      --line: var(--t-line, #24304f); --accent: var(--t-accent, #6fe3ff); --gold: var(--t-highlight, #ffc857);
      --up: var(--t-up, #7dffb3); --down: var(--t-down, #ff6b6b);
      --rainbow: #ff6b6b, #ffc857, #7dffb3, #6fe3ff, #9b8cff;
    }
    /* Hogwarts' highlight is Gryffindor scarlet: a lamp lit in red reads as a fault, so it burns candle gold */
    :root[data-theme="hogwarts"] { --gold: var(--t-accent); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--t-font-body, system-ui, sans-serif); overflow-x: hidden; }
    main { position: relative; max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }

    /* the aurora: the rainbow bridge, drifting slowly behind everything */
    .aurora { position: fixed; inset: -20vh -20vw auto; height: 70vh; pointer-events: none; z-index: 0; opacity: 0.22; filter: blur(70px);
      background: conic-gradient(from 180deg at 50% 100%, var(--rainbow), #ff6b6b); border-radius: 0 0 50% 50%; animation: drift 24s ease-in-out infinite alternate; }
    [data-theme] .aurora { opacity: 0.1; }
    @keyframes drift { from { transform: translateX(-6vw) rotate(-4deg); } to { transform: translateX(6vw) rotate(4deg); } }
    main > * { position: relative; z-index: 1; }

    /* header: the logo's waves leave the transmitter one after the other */
    h1 { margin: 0 0 4px; font-size: 1.5rem; display: flex; align-items: center; gap: 12px; }
    h1 svg { width: 48px; height: 48px; overflow: visible; }
    h1 .wave { animation: beam 2.6s ease-in-out infinite; }
    h1 .w2 { animation-delay: 0.15s; } h1 .w3 { animation-delay: 0.3s; } h1 .w4 { animation-delay: 0.45s; } h1 .w5 { animation-delay: 0.6s; }
    @keyframes beam { 0%, 100% { opacity: 0.35; } 30% { opacity: 1; } }
    .sub { color: var(--muted); font-size: 0.85rem; }
    [data-theme] h1 { font-family: var(--t-font-display); letter-spacing: 0.08em; text-transform: uppercase; }

    .label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 8px 2px -6px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }

    /* ---------- outlets ---------- */
    #outlets { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .outlet { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; position: relative; overflow: hidden;
      transition: border-color 0.4s, box-shadow 0.4s; }
    .outlet h2 { margin: 0; font-size: 1.1rem; }
    .outlet .when { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; min-height: 1.3em; }
    .outlet.on { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); box-shadow: 0 0 28px -8px var(--gold); }
    [data-theme] .outlet h2 { font-family: var(--t-font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-accent); }

    /* a rainbow streak crosses the card when a switch is confirmed */
    .outlet::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: linear-gradient(100deg, transparent 30%, #ff6b6b55, #ffc85755, #7dffb355, #6fe3ff55, #9b8cff55, transparent 70%);
      transform: translateX(-100%); }
    .outlet.burst::after { animation: streak 0.9s ease-out; }
    @keyframes streak { 0% { opacity: 1; transform: translateX(-100%); } 100% { opacity: 0; transform: translateX(100%); } }
    .outlet.failed, .cover.failed, .projector.failed { animation: shake 0.45s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    /* the bulb, and the radio waves it sends while a code is on its way */
    .bulb { position: relative; width: 56px; height: 56px; display: grid; place-items: center; }
    .bulb svg { width: 44px; height: 44px; overflow: visible; transition: transform 0.3s; }
    .bulb .glass { fill: none; stroke: var(--muted); stroke-width: 3; transition: fill 0.4s, stroke 0.4s; }
    .bulb .base { fill: var(--muted); }
    .bulb .rays { stroke: var(--gold); stroke-width: 3; stroke-linecap: round; opacity: 0; transform-origin: 24px 20px; transition: opacity 0.4s; }
    .on .bulb .glass { fill: var(--gold); stroke: var(--gold); }
    .on .bulb svg { filter: drop-shadow(0 0 10px var(--gold)); }
    .on .bulb .rays { opacity: 1; animation: spin 14s linear infinite; }
    .burst .bulb svg { animation: pop 0.5s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 40% { transform: scale(1.25); } }
    .ring { position: absolute; inset: 4px; border-radius: 50%; border: 2px solid; opacity: 0; pointer-events: none; }
    .ring:nth-child(1) { border-color: #6fe3ff; } .ring:nth-child(2) { border-color: #7dffb3; animation-delay: 0.3s !important; } .ring:nth-child(3) { border-color: #9b8cff; animation-delay: 0.6s !important; }
    .pending .ring { animation: ripple 1.2s ease-out infinite; }
    @keyframes ripple { from { opacity: 0.9; transform: scale(0.7); } to { opacity: 0; transform: scale(2); } }

    /* the switch: a rainbow when on, shimmering while it waits for the outlet */
    .switch { position: relative; width: 66px; height: 36px; padding: 0; border-radius: 99px; cursor: pointer;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--line) 70%, transparent); transition: background 0.35s, box-shadow 0.35s; }
    .switch .knob { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--text);
      box-shadow: 0 2px 6px #0008; transition: left 0.35s cubic-bezier(0.5, 1.6, 0.4, 0.8), transform 0.2s; }
    .switch[aria-checked="true"] { background: linear-gradient(90deg, var(--rainbow)); background-size: 200% 100%; box-shadow: 0 0 16px -2px #6fe3ff99; }
    .switch[aria-checked="true"] .knob { left: 33px; }
    .switch[aria-checked="mixed"] .knob { left: 18px; opacity: 0.6; }
    .switch:active .knob { transform: scaleX(1.15); }
    .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .pending .switch { background: linear-gradient(90deg, var(--line), #6fe3ff66, var(--line)); background-size: 200% 100%; animation: shimmer 1s linear infinite; }
    .pending .switch[aria-checked="true"] { background: linear-gradient(90deg, var(--rainbow), #ff6b6b); background-size: 200% 100%; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---------- covers: the projection screen, drawn at the position the hub reckons ---------- */
    #covers { display: grid; gap: 14px; }
    .cover { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; }
    .cover h2 { margin: 0; font-size: 1.1rem; }
    .cover .when { margin: 2px 0 12px; color: var(--muted); font-size: 0.85rem; min-height: 1.3em; }
    [data-theme] .cover h2 { font-family: var(--t-font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-accent); }
    .screen { position: relative; height: 152px; --p: 0; --t: 0; }
    .screen .case { position: relative; z-index: 2; height: 14px; border-radius: 7px; background: linear-gradient(#3a4566, #1b2340);
      border: 1px solid var(--line); box-shadow: 0 3px 8px #0008; }
    .screen .case::after { content: ""; position: absolute; right: 8px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
    .moving .screen .case::after { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: beam 0.8s ease-in-out infinite; }
    .screen .cloth { position: absolute; left: 10px; right: 10px; top: 9px; height: calc(var(--p) * 1.32px); overflow: hidden;
      background: linear-gradient(#f2f4ff, #cfd6f2); border-bottom: 4px solid #8e9bc4; border-radius: 0 0 3px 3px;
      transition: height 1s linear; box-shadow: 0 6px 18px -6px #000a; }
    .cover.unknown .screen .cloth { background: repeating-linear-gradient(135deg, #cfd6f233 0 8px, transparent 8px 16px); border-bottom-style: dashed; }
    /* the picture on the screen: the rainbow bridge, brighter as the screen comes down */
    .screen .cloth::before { content: ""; position: absolute; inset: 8px 8px auto; height: 106px; border-radius: 4px; opacity: calc(var(--p) / 140);
      background: radial-gradient(ellipse at 50% 120%, transparent 38%, #ff6b6b 39% 44%, #ffc857 45% 50%, #7dffb3 51% 56%, #6fe3ff 57% 62%, #9b8cff 63% 68%, transparent 69%),
                  linear-gradient(#0b1020, #1d2850); transition: opacity 1s linear; }
    .screen .mark { position: absolute; left: 2px; right: 2px; top: calc(9px + var(--t) * 1.32px); border-top: 2px dashed var(--accent); opacity: 0;
      transition: opacity 0.3s; pointer-events: none; }
    .moving .screen .mark { opacity: 0.8; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .controls button { min-width: 44px; height: 38px; padding: 0 12px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 0.9rem;
      color: var(--text); background: color-mix(in srgb, var(--line) 70%, transparent); border: 1px solid var(--line); transition: background 0.2s, border-color 0.2s; }
    .controls button:hover { border-color: var(--accent); }
    .controls button:focus-visible, .cover input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .controls button.stop { color: var(--down); }
    /* by hand, as on the remote; and "it is rolled up / open" when the drawing and the screen disagree */
    .controls.manual { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    .controls.manual button { height: 30px; min-width: 36px; padding: 0 10px; font-size: 0.8rem; color: var(--muted); background: transparent; }
    .controls.manual button:hover { color: var(--text); }
    .controls.manual button.declare { margin-left: auto; }
    .controls.manual button.declare + button.declare { margin-left: 0; }
    .cover input[type="range"] { width: 100%; margin: 14px 0 0; accent-color: var(--accent); }
    @media (max-width: 520px) { .cover { grid-template-columns: 1fr; } .screen { max-width: 180px; } }

    /* ---------- projectors: a beam of light when on, the app in front, a small remote ---------- */
    #projectors { display: grid; gap: 14px; }
    .projector { display: grid; grid-template-columns: 150px 1fr auto; gap: 22px; align-items: center; transition: border-color 0.4s, box-shadow 0.4s; }
    .projector.on { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 28px -8px var(--accent); }
    .projector h2 { margin: 0; font-size: 1.1rem; }
    .projector .when { margin: 2px 0 12px; color: var(--muted); font-size: 0.85rem; min-height: 1.3em; }
    [data-theme] .projector h2 { font-family: var(--t-font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--t-accent); }
    .beamer { position: relative; height: 96px; }
    .beamer svg { width: 150px; height: 96px; overflow: visible; }
    .beamer .body { fill: #1b2340; stroke: var(--muted); stroke-width: 2; }
    .beamer .lens { fill: #0b1020; stroke: var(--muted); stroke-width: 2; transition: fill 0.4s; }
    .beamer .cone { opacity: 0; transition: opacity 0.6s; }
    .beamer .led { fill: var(--down); }
    .on .beamer .lens { fill: #e6ecff; filter: drop-shadow(0 0 6px #6fe3ff); }
    .on .beamer .cone { opacity: 1; animation: flicker 3s ease-in-out infinite; }
    .on .beamer .led { fill: var(--up); }
    .away .beamer svg { opacity: 0.45; }
    @keyframes flicker { 50% { opacity: 0.75; } }
    .apps { display: flex; flex-wrap: wrap; gap: 6px; }
    .apps button { height: 30px; padding: 0 10px; border-radius: 99px; cursor: pointer; font: inherit; font-size: 0.8rem; color: var(--text);
      background: color-mix(in srgb, var(--line) 70%, transparent); border: 1px solid var(--line); transition: border-color 0.2s, background 0.2s; }
    .apps button:hover { border-color: var(--accent); }
    .apps button.front { background: linear-gradient(90deg, var(--rainbow)); color: #0b1020; border-color: transparent; font-weight: 600; }
    .remote { display: grid; grid-template-columns: repeat(3, 34px); grid-auto-rows: 34px; gap: 4px; }
    .remote button { padding: 0; border-radius: 9px; cursor: pointer; font-size: 0.85rem; color: var(--text);
      background: color-mix(in srgb, var(--line) 70%, transparent); border: 1px solid var(--line); }
    .remote button:hover { border-color: var(--accent); }
    .remote button.ok { border-radius: 50%; }
    .projector button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .projector .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    /* its screen, live: a click there is a tap on the projector */
    .projector .screen-btn { height: 30px; padding: 0 12px; border-radius: 99px; cursor: pointer; font: inherit; font-size: 0.8rem; color: var(--text);
      background: transparent; border: 1px dashed var(--line); margin-left: auto; }
    .projector .screen-btn[aria-pressed="true"] { border-style: solid; border-color: var(--accent); }
    .mirror { grid-column: 1 / -1; margin: 0; position: relative; }
    .mirror img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 10px; cursor: crosshair; }
    .mirror figcaption { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; pointer-events: none; }
    @media (max-width: 640px) { .projector { grid-template-columns: 1fr; } .beamer { height: 70px; } .beamer svg { height: 70px; } }

    /* ---------- the chain: Homebridge, broker, RF bridge, the air ---------- */
    .chain { display: flex; align-items: center; gap: 0; position: relative; }
    .node { flex: none; display: grid; justify-items: center; gap: 6px; width: 84px; text-align: center; font-size: 0.78rem; color: var(--muted); }
    .node .dot { position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--down); }
    .node.up .dot { background: var(--up); }
    .node.up .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--up); animation: ping 2.4s ease-out infinite; }
    @keyframes ping { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
    .node.up { color: var(--text); }
    .link { flex: 1; height: 3px; margin-bottom: 26px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
    .link.up { background: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 16px); background-size: 32px 3px; animation: flow 1.6s linear infinite; opacity: 0.55; }
    @keyframes flow { to { background-position: 32px 0; } }
    .packet { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; pointer-events: none;
      box-shadow: 0 0 8px #fff, 0 0 18px #6fe3ff, 0 0 30px #9b8cff; }
    .air { display: flex; gap: 3px; height: 14px; align-items: center; }
    .air i { width: 6px; height: 14px; border: 2px solid var(--muted); border-left: 0; border-radius: 0 14px 14px 0; opacity: 0.4; }
    .node.up .air i { border-color: var(--up); animation: beam 1.8s ease-in-out infinite; }
    .node.up .air i:nth-child(2) { animation-delay: 0.2s; } .node.up .air i:nth-child(3) { animation-delay: 0.4s; }
    .last { margin: 12px 0 0; color: var(--muted); font-size: 0.85rem; text-align: center; }
    .last b { color: var(--text); font-family: var(--t-font-mono, ui-monospace, monospace); font-weight: 500; transition: color 0.3s; }
    .last.fresh b { color: var(--accent); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 32px)); opacity: 0; z-index: 9; padding: 10px 16px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--down); color: var(--text); font-size: 0.9rem; transition: transform 0.35s cubic-bezier(0.5, 1.6, 0.4, 0.8), opacity 0.35s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .empty { color: var(--muted); text-align: center; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="t-app">
  <div class="aurora"></div>
  <main>
    <header>
      <h1 class="t-title">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <g fill="none" stroke-width="8" stroke-linecap="round">
            <path class="wave w1" d="M60 110 A20 20 0 0 1 100 110" stroke="#9b8cff"/>
            <path class="wave w2" d="M48 110 A32 32 0 0 1 112 110" stroke="#6fe3ff"/>
            <path class="wave w3" d="M36 110 A44 44 0 0 1 124 110" stroke="#7dffb3"/>
            <path class="wave w4" d="M24 110 A56 56 0 0 1 136 110" stroke="#ffc857"/>
            <path class="wave w5" d="M12 110 A68 68 0 0 1 148 110" stroke="#ff6b6b"/>
          </g>
          <circle cx="80" cy="110" r="7" fill="#fff"/>
        </svg>
        Bifrost
      </h1>
      <div class="sub" id="updated">loading…</div>
    </header>

    <div class="label t-label">Outlets</div>
    <section id="outlets"></section>

    <div class="label t-label" id="cinema-label" hidden>Cinema</div>
    <section id="projectors" hidden></section>
    <section id="covers" hidden></section>

    <div class="label t-label">Signal path</div>
    <section class="panel t-panel">
      <div class="chain" id="chain">
        <div class="node" data-n="homebridge"><span class="dot"></span>HomeKit</div>
        <div class="link" data-l="0"></div>
        <div class="node" data-n="broker"><span class="dot"></span>Broker</div>
        <div class="link" data-l="1"></div>
        <div class="node" data-n="bridge"><span class="dot"></span>RF bridge</div>
        <div class="link" data-l="2"></div>
        <div class="node" data-n="air"><span class="air"><i></i><i></i><i></i></span>433 MHz</div>
      </div>
      <p class="last" id="last">no RF code yet</p>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="bifrost.js"></script>
</body>
</html>
