<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Bifrost: a longship riding radio waves">
  <g class="boat">
    <!-- mast and the striped sail -->
    <line x1="78" y1="30" x2="78" y2="100" stroke="#e6ecff" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 36 L106 36 Q 113 65 106 92 L50 92 Q 43 65 50 36 Z" fill="#ff6b6b"/>
    <path d="M64 36 Q 59 64 64 92 L78 92 Q 73 64 78 36 Z M92 36 Q 87 64 92 92 L106 92 Q 101 64 106 36 Z" fill="#fff" opacity="0.9"/>
    <line x1="48" y1="36" x2="108" y2="36" stroke="#e6ecff" stroke-width="4" stroke-linecap="round"/>
    <!-- the hull, its stern curled up at the left, the dragon's neck at the right -->
    <path d="M22 96 Q 80 120 138 96 L142 72 Q 146 64 140 62 Q 134 84 130 94 L30 94 Q 24 78 26 66 Q 16 68 18 80 Z" fill="#ffc857" stroke="#e8a93a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M26 66 Q 22 56 30 52 Q 34 62 30 70 Z" fill="#ffc857" stroke="#e8a93a" stroke-width="3" stroke-linejoin="round"/>
    <!-- the dragon's head -->
    <path d="M138 66 Q 136 50 148 46 L158 50 L150 54 L154 60 Q 150 68 138 66 Z" fill="#ffc857" stroke="#e8a93a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="146" cy="53" r="2.2" fill="#0b1020"/>
    <!-- the shields along the side -->
    <g fill="#6fe3ff" stroke="#0b1020" stroke-width="2">
      <circle cx="44" cy="99" r="6"/><circle cx="62" cy="102" r="6"/><circle cx="80" cy="103" r="6"/><circle cx="98" cy="102" r="6"/><circle cx="116" cy="99" r="6"/>
    </g>
    <g fill="#0b1020"><circle cx="44" cy="99" r="1.8"/><circle cx="62" cy="102" r="1.8"/><circle cx="80" cy="103" r="1.8"/><circle cx="98" cy="102" r="1.8"/><circle cx="116" cy="99" r="1.8"/></g>
  </g>
  <!-- the sea: radio waves -->
  <g fill="none" stroke="#6fe3ff" stroke-width="6" stroke-linecap="round">
    <path class="sea s1" d="M8 122 Q 20 110 32 122 T 56 122 T 80 122 T 104 122 T 128 122 T 152 122"/>
    <path class="sea s2" d="M8 140 Q 20 128 32 140 T 56 140 T 80 140 T 104 140 T 128 140 T 152 140" opacity="0.5"/>
  </g>
</svg>
