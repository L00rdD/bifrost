<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Bifrost: a rainbow bridge made of radio waves, rising from a transmitter between two shores">
  <defs>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9f6ff"/>
      <stop offset="1" stop-color="#6fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the bridge: radio waves in the colours of the rainbow -->
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path class="wave w1" d="M60 110 A20 20 0 0 1 100 110" stroke="#9b8cff"/>
    <path class="wave w2" d="M48 110 A32 32 0 0 1 112 110" stroke="#6fe3ff"/>
    <path class="wave w3" d="M36 110 A44 44 0 0 1 124 110" stroke="#7dffb3"/>
    <path class="wave w4" d="M24 110 A56 56 0 0 1 136 110" stroke="#ffc857"/>
    <path class="wave w5" d="M12 110 A68 68 0 0 1 148 110" stroke="#ff6b6b"/>
  </g>
  <!-- the transmitter it rises from -->
  <circle cx="80" cy="110" r="13" fill="url(#spark)"/>
  <circle cx="80" cy="110" r="5" fill="#ffffff"/>
  <!-- the two shores it joins -->
  <g stroke="#7fa9b8" stroke-width="5" stroke-linecap="round">
    <line x1="6" y1="126" x2="46" y2="126"/>
    <line x1="114" y1="126" x2="154" y2="126"/>
    <line x1="18" y1="140" x2="40" y2="140"/>
    <line x1="120" y1="140" x2="142" y2="140"/>
  </g>
</svg>
